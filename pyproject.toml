[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.60",
    "llama-index>=0.12.0",
    "psycopg[binary]>=3.2.0",
    "pymilvus>=2.4.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "redis>=5.2.0",
    "rq>=2.1.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
